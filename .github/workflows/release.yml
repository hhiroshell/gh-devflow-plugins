name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version consistency
        run: |
          tag_version="${{ steps.tag.outputs.version }}"
          tag_name="${GITHUB_REF_NAME}"
          plugin_version=$(jq -r '.version' github-devflow/.claude-plugin/plugin.json)
          marketplace_ref=$(jq -r '.plugins[0].source.ref' .claude-plugin/marketplace.json)

          echo "Tag version:         $tag_version"
          echo "Tag name:            $tag_name"
          echo "plugin.json version: $plugin_version"
          echo "marketplace.json ref: $marketplace_ref"

          if [ "$tag_version" != "$plugin_version" ]; then
            echo "::error::Tag version ($tag_version) does not match plugin.json version ($plugin_version)"
            exit 1
          fi

          if [ "$tag_name" != "$marketplace_ref" ]; then
            echo "::error::Tag name ($tag_name) does not match marketplace.json ref ($marketplace_ref)"
            exit 1
          fi

          echo "All checks passed: version=$tag_version, ref=$tag_name"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
